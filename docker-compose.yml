version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: artificiall-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-artificiall}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-artificiall}
      POSTGRES_DB: ${DB_NAME:-artificiall}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: artificiall-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
